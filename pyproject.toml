[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bcv-trader"
version = "0.1.0"
description = "A compliant personal-trading strategy tool that encodes the firm's Personal Compliance policy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # pure standard library

[project.scripts]
bcv-trader = "bcv_trader.cli:main"

[tool.setuptools]
packages = ["bcv_trader"]
